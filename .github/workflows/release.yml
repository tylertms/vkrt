name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ github.ref_name }}
      appimage: true

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: vkrt-*-x64
          merge-multiple: true
          path: dist

      - name: Calculate checksums
        working-directory: dist
        run: sha256sum vkrt-windows-x64.zip vkrt-linux-x64.tar.gz vkrt-linux-x86_64.AppImage > SHA256SUMS

      - name: Upload all assets to a draft
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/vkrt-windows-x64.zip
            dist/vkrt-linux-x64.tar.gz
            dist/vkrt-linux-x86_64.AppImage
            dist/SHA256SUMS

      - name: Publish complete release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

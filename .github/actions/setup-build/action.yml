name: Setup build
description: Install the pinned build tools and Vulkan SDK
runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.14'
        cache: pip
        cache-dependency-path: scripts/requirements-*.txt

    - if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
      with:
        arch: x64

    - if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends build-essential pkg-config nasm patchelf libvulkan1 libdbus-1-dev libwayland-dev libxkbcommon-dev wayland-protocols libx11-dev libxrandr-dev libxinerama-dev libxi-dev libxcursor-dev libxext-dev desktop-file-utils

    - shell: bash
      run: python -m pip install --requirement scripts/requirements-build.txt

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: .cache/vulkan-sdk
        key: vulkan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/toolchain.json', 'scripts/setup_vulkan.py') }}

    - shell: bash
      run: python scripts/setup_vulkan.py

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: subprojects/packagecache
        key: wraps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('subprojects/*.wrap', 'subprojects/packagefiles/**') }}
